name: Refresh fund historical returns
on:
  workflow_dispatch:
  schedule:
    - cron: "25 13 * * 1-5"
concurrency:
  group: fidelity-utma-fund-refresh
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Refresh historical fund data
        env:
          ALPHAVANTAGE_API_KEY: ${{ secrets.ALPHAVANTAGE_API_KEY }}
        run: python scripts/refresh_funds.py
      - name: Preserve refreshed fund catalog as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fund-data-snapshot
          path: data/funds.json
          retention-days: 7
      - name: Commit data updates when available
        run: bash .github/scripts/save-fund-data.sh "Refresh verified historical fund returns"

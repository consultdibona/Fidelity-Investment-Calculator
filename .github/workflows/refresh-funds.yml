name: Refresh fund historical returns
on:
  workflow_dispatch:
  schedule:
    - cron: "25 13 * * 1"
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Refresh historical fund data
        env:
          ALPHAVANTAGE_API_KEY: ${{ secrets.ALPHAVANTAGE_API_KEY }}
        run: python scripts/refresh_funds.py
      - name: Commit data updates when available
        run: |
          if ! git diff --quiet -- data/funds.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/funds.json
            git commit -m "Refresh verified historical fund returns"
            git push
          fi

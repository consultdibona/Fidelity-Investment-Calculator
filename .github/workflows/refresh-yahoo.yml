name: Refresh Yahoo fund metrics
on:
  workflow_dispatch:
  schedule:
    - cron: "40 14 * * 2"
concurrency:
  group: fidelity-utma-fund-refresh
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install yfinance
        run: python -m pip install "yfinance>=0.2.60,<2"
      - name: Test return calculations before updating data
        run: python -m unittest discover -s scripts -p "test_yahoo_returns.py" -v
      - name: Refresh available fund-level performance and yield fields
        run: python scripts/refresh_yahoo.py
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Yahoo fundPerformance client
        run: npm install --no-save --no-package-lock --ignore-scripts yahoo-finance2@4.0.6
      - name: Test direct Yahoo fundPerformance conversion
        run: node scripts/refresh_yahoo_performance.mjs --self-test
      - name: Retrieve Yahoo published fund-performance table
        run: node scripts/refresh_yahoo_performance.mjs
      - name: Preserve refreshed fund catalog as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fund-data-snapshot
          path: data/funds.json
          retention-days: 7
      - name: Save updates
        run: bash .github/scripts/save-fund-data.sh "Update available Yahoo Finance fund metrics"
